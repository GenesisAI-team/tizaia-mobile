name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: "10.12.1"

      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('mobile/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm --dir mobile install --frozen-lockfile

      - name: Validate mobile
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:3000
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-public-key
          EXPO_PUBLIC_N8N_ASSISTANT_WEBHOOK_URL: https://example.com/webhook
        run: pnpm validate

  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: "10.12.1"

      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('backend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm --dir backend install --frozen-lockfile

      - name: Validate backend
        working-directory: backend
        run: pnpm validate

      - name: Build backend
        working-directory: backend
        run: pnpm build

      - name: Start server
        working-directory: backend
        run: node dist/server.js &
        env:
          PORT: "3000"

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000/health > /dev/null 2>&1; then
              echo "Server is ready"
              exit 0
            fi
            echo "Waiting for server... ($i/30)"
            sleep 1
          done
          echo "Server did not start within 30 seconds"
          exit 1

      - name: Verify /health
        run: |
          HEALTH=$(curl -s http://localhost:3000/health)
          echo "$HEALTH"
          echo "$HEALTH" | grep -q '"status":"ok"' || { echo "FAIL: /health missing status ok"; exit 1; }
          echo "$HEALTH" | grep -q '"teacher"' || { echo "FAIL: /health missing teacher"; exit 1; }

      - name: Verify /v1/bootstrap
        run: |
          BOOTSTRAP=$(curl -s http://localhost:3000/v1/bootstrap)
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/v1/bootstrap)
          echo "HTTP $HTTP_CODE"
          [ "$HTTP_CODE" = "200" ] || { echo "FAIL: /v1/bootstrap returned $HTTP_CODE"; exit 1; }
          echo "$BOOTSTRAP" | grep -q '"teacher"' || { echo "FAIL: /v1/bootstrap missing teacher"; exit 1; }
