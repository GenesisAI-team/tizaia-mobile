name: Configuration validation

on:
  push:
    branches: [main, 'chore/**']
  pull_request:

permissions:
  contents: read

jobs:
  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate JSON
        shell: pwsh
        run: |
          Get-Content -Raw opencode.json | ConvertFrom-Json | Out-Null

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem scripts -Filter '*.ps1' -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) { throw "$($_.Name): $($errors -join '; ')" }
          }

      - name: Reject mojibake and embedded secrets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @('AGENTS.md', 'agent-orchestrator.yaml', 'opencode.json') +
            @(Get-ChildItem scripts -Filter '*.ps1' -File | ForEach-Object FullName)
          foreach ($file in $files) {
            $text = Get-Content -Raw -Encoding utf8 $file
            if ($text.Contains('Ã') -or $text.Contains('Â') -or $text.Contains([char]0xfffd)) {
              throw "Mojibake detected in $file"
            }
            if ($text -match 'gho_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}') {
              throw "Secret-like token detected in $file"
            }
          }

      - name: Check PR patch whitespace
        if: github.event_name == 'pull_request'
        shell: bash
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
